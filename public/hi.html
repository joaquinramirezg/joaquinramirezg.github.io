<script>
(function () {
  // ---- who tapped: the sticker carries ?k=<token>; the page holds only its hash ----
  var HASH = '29d13eb636b8560aceb691f30032ac9bacdd61b806d2a6c6ea8372ac6742f97d';
  var WA_ENC = 'NzUxODE2NTMxMjE=';   // WhatsApp digits, reversed and base64d, so a phone-number scraper does not match the source
  var k = new URLSearchParams(location.search).get('k') || '';
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var vcard = document.getElementById('vcard');
  var wa = document.getElementById('wa');
  var via = 'direct';

  // iOS Safari routes a downloaded .vcf to Files; without the attribute it opens the Contacts sheet.
  if (!isIOS) vcard.setAttribute('download', 'Joaquin Ramirez.vcf');
  else document.getElementById('ios-hint').hidden = false;

  function unlock() {
    vcard.href = '/c/' + k + '.vcf';
    try {
      var digits = atob(WA_ENC).split('').reverse().join('');
      wa.href = 'https://wa.me/' + digits;
      wa.hidden = false;
    } catch (e) {}
    via = 'tag';
  }

  function sha256hex(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    });
  }

  var gate = (k && window.crypto && crypto.subtle)
    ? sha256hex(k).then(function (h) { if (h === HASH) unlock(); }).catch(function () {})
    : Promise.resolve();

  // ---- analytics: queue until the deferred umami script is ready ----
  var queue = [], ready = false, tries = 0;
  function flush() {
    if (!window.umami || !window.umami.track) return false;
    ready = true;
    while (queue.length) { var q = queue.shift(); try { window.umami.track(q[0], q[1]); } catch (e) {} }
    return true;
  }
  function track(name, data) {
    if (ready || flush()) { try { window.umami.track(name, data || {}); } catch (e) {} return; }
    if (queue.length < 20) queue.push([name, data || {}]);
  }
  var poll = setInterval(function () { if (flush() || ++tries > 40) clearInterval(poll); }, 250);

  gate.then(function () { track('hi_view', { via: via }); });

  Array.prototype.forEach.call(document.querySelectorAll('.btn'), function (a) {
    a.addEventListener('click', function () { track('hi_tap', { target: a.getAttribute('data-target') }); });
  });
})();
</script>
